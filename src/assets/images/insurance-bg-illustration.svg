<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <!-- Casa izquierda -->
  <g stroke="#e0e0e0" stroke-width="1.5" fill="none">
    <!-- Casa 1 -->
    <path d="M50 400 L50 300 L100 250 L150 300 L150 400 Z"/>
    <rect x="70" y="340" width="30" height="60"/>
    <rect x="110" y="310" width="25" height="25"/>
    <path d="M40 300 L100 240 L160 300"/>
    
    <!-- Árbol -->
    <circle cx="200" cy="350" r="40"/>
    <line x1="200" y1="390" x2="200" y2="450"/>
    
    <!-- Auto -->
    <path d="M220 420 Q240 380 280 380 Q320 380 340 420"/>
    <rect x="230" y="420" width="100" height="30" rx="5"/>
    <circle cx="255" cy="455" r="12"/>
    <circle cx="305" cy="455" r="12"/>
  </g>
  
  <!-- Familia centro-izquierda -->
  <g stroke="#d0d0d0" stroke-width="1.5" fill="none">
    <!-- Persona 1 -->
    <circle cx="380" cy="360" r="15"/>
    <line x1="380" y1="375" x2="380" y2="420"/>
    <line x1="380" y1="390" x2="360" y2="410"/>
    <line x1="380" y1="390" x2="400" y2="410"/>
    <line x1="380" y1="420" x2="365" y2="460"/>
    <line x1="380" y1="420" x2="395" y2="460"/>
    
    <!-- Persona 2 -->
    <circle cx="420" cy="370" r="12"/>
    <line x1="420" y1="382" x2="420" y2="420"/>
    <line x1="420" y1="395" x2="405" y2="410"/>
    <line x1="420" y1="395" x2="435" y2="410"/>
    <line x1="420" y1="420" x2="408" y2="455"/>
    <line x1="420" y1="420" x2="432" y2="455"/>
    
    <!-- Corazón/escudo protección -->
    <path d="M400 320 C400 300 430 300 400 270 C370 300 400 300 400 320" stroke="#c0c0c0"/>
  </g>
  
  <!-- Escudo de protección grande (centro derecha) -->
  <g stroke="#e8e8e8" stroke-width="2" fill="none">
    <path d="M850 280 L850 380 Q850 430 900 460 Q950 430 950 380 L950 280 Q900 260 850 280"/>
    <path d="M880 360 L895 380 L930 330" stroke-width="3"/>
  </g>
  
  <!-- Casa derecha -->
  <g stroke="#e0e0e0" stroke-width="1.5" fill="none">
    <!-- Casa 2 más grande -->
    <path d="M1000 400 L1000 280 L1070 220 L1140 280 L1140 400 Z"/>
    <rect x="1030" y="330" width="40" height="70"/>
    <rect x="1080" y="300" width="30" height="30"/>
    <circle cx="1095" cy="315" r="8"/>
    <path d="M985 280 L1070 200 L1155 280"/>
    
    <!-- Ventana redonda ático -->
    <circle cx="1070" cy="270" r="15"/>
    
    <!-- Arbusto -->
    <ellipse cx="1160" cy="410" rx="25" ry="20"/>
  </g>
  
  <!-- Nubes sutiles -->
  <g stroke="#f0f0f0" stroke-width="1" fill="none">
    <ellipse cx="150" cy="180" rx="50" ry="20"/>
    <ellipse cx="120" cy="170" rx="30" ry="15"/>
    <ellipse cx="180" cy="175" rx="25" ry="12"/>
    
    <ellipse cx="500" cy="150" rx="60" ry="25"/>
    <ellipse cx="460" cy="140" rx="35" ry="18"/>
    <ellipse cx="540" cy="145" rx="30" ry="15"/>
    
    <ellipse cx="1000" cy="160" rx="55" ry="22"/>
    <ellipse cx="960" cy="150" rx="32" ry="16"/>
    <ellipse cx="1040" cy="155" rx="28" ry="14"/>
  </g>
  
  <!-- Mascota (perro) -->
  <g stroke="#d5d5d5" stroke-width="1.5" fill="none">
    <ellipse cx="480" cy="440" rx="20" ry="12"/>
    <circle cx="500" cy="430" r="10"/>
    <path d="M505 425 L512 418"/>
    <path d="M495 425 L488 418"/>
    <line x1="460" y1="440" x2="450" y2="435"/>
    <ellipse cx="475" cy="455" rx="5" ry="8"/>
    <ellipse cx="485" cy="455" rx="5" ry="8"/>
  </g>
  
  <!-- Persona en banco -->
  <g stroke="#d8d8d8" stroke-width="1.5" fill="none">
    <rect x="750" y="420" width="60" height="8"/>
    <line x1="755" y1="428" x2="755" y2="460"/>
    <line x1="805" y1="428" x2="805" y2="460"/>
    
    <circle cx="780" cy="395" r="12"/>
    <path d="M780 407 L780 428"/>
    <path d="M780 415 L765 425"/>
    <path d="M780 415 L795 408"/>
  </g>
  
  <!-- Símbolos de seguros sutiles -->
  <g stroke="#ebebeb" stroke-width="1" fill="none">
    <!-- Cruz médica -->
    <rect x="620" cy="380" width="20" height="6" rx="1"/>
    <rect x="627" cy="373" width="6" height="20" rx="1"/>
    
    <!-- Paraguas -->
    <path d="M700 350 Q700 320 730 320 Q760 320 760 350"/>
    <line x1="730" y1="320" x2="730" y2="400"/>
    <path d="M730 400 Q720 410 720 395"/>
  </g>
</svg>
